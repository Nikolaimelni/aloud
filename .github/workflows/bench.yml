name: bench

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloud/bench exec playwright install --with-deps chromium
      - run: pnpm --filter @aloud/bench run bench
        env:
          # The runners have no GPU, so asking for WebGPU here would measure a software
          # rasteriser and call it a graphics card.
          BENCH_DEVICES: wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: packages/bench/report/

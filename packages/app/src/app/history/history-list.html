@if (archive.sessions().length > 0) {
  <section class="panel">
    <div class="head">
      <h2>Earlier sessions</h2>
      <span class="size">{{ stored() }} in this browser</span>
      <button type="button" class="plain" (click)="clear()">Delete all</button>
    </div>

    <ul class="list">
      @for (item of archive.sessions(); track item.id) {
        <li>
          <button
            type="button"
            class="row"
            [disabled]="session.listening()"
            (click)="open(item.id)"
          >
            <span class="when">{{ when(item.startedAt) }}</span>
            <span class="length">{{ length(item.seconds) }}</span>
            <span class="preview">{{ preview(item.segments[0]?.text ?? '') }}</span>
          </button>
          <button
            type="button"
            class="plain"
            [attr.aria-label]="'Delete session from ' + when(item.startedAt)"
            (click)="remove(item.id, $event)"
          >
            Delete
          </button>
        </li>
      }
    </ul>

    <p class="hint">
      The last ten sessions are kept here, audio and all. Nothing has been uploaded, and clearing
      the site data removes them for good.
    </p>
  </section>
}

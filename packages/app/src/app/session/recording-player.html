<audio
  #audio
  preload="metadata"
  [src]="src()"
  (timeupdate)="tick()"
  (loadedmetadata)="loaded()"
  (play)="playing.set(true)"
  (pause)="playing.set(false)"
></audio>

<button
  type="button"
  class="play"
  [attr.aria-label]="playing() ? 'Pause' : 'Play the recording'"
  (click)="toggle()"
>
  <span class="glyph" [class.pause]="playing()"></span>
</button>

<input
  class="scrub"
  type="range"
  min="0"
  step="0.1"
  aria-label="Position in the recording"
  [max]="length()"
  [value]="at()"
  (input)="scrub($event)"
/>

<span class="time">{{ clock(at()) }} / {{ clock(length()) }}</span>

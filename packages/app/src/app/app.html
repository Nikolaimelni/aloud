<header class="masthead">
  <h1 class="name">
    <span class="light" [class.on]="session.listening()" aria-hidden="true"></span>Aloud
  </h1>
  <p class="lede">
    Live captions for whatever you are saying or hearing, written in the browser. The audio never
    leaves this tab.
  </p>
</header>

<main>
  <aloud-session />
  <aloud-settings />
  <aloud-history />
</main>

<footer class="colophon">
  <p>
    Speech recognition by Moonshine, voice detection by Silero, both running here on your machine.
    There is no account and nothing is uploaded.
  </p>
</footer>
